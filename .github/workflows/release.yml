name: Release preview

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (without leading v)"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk navidroid-${{ inputs.version }}.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: navidroid ${{ inputs.version }}
          body: |
            First public preview of navidroid — xvoidsx's hard fork of Slauncher, rebuilt in a night with a calendar line, an in-launcher wallpaper picker, a landscape toggle, eight pinned apps, and a nightshadeNeon soul.

            Install the APK below; preview builds update over each other.
          files: navidroid-${{ inputs.version }}.apk
          prerelease: true
