name: Release preview

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (without leading v)"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk navidroid-${{ inputs.version }}.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: navidroid ${{ inputs.version }}
          body: |
            Second public preview of navidroid. New: a Default AI Agent — pick from a curated list in Settings, then a line under the calendar on home reads "Ask <name>" and opens it; if the agent isn't installed, it opens its Play listing instead. Long-press the line to switch agents without opening Settings. The calendar line now counts down too: "in 40m" for what's coming, "ends in 1h 5m" for what's on.

            Install the APK below; preview builds update over each other.
          files: navidroid-${{ inputs.version }}.apk
          prerelease: true
